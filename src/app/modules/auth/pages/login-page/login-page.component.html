<div class="login-container">
  <div class="login-card">
    <h2 class="app-name">Event <span>Hub</span></h2>
    <h3 class="welcome-text">Welcome Back!</h3>
    <p class="subtitle">Log in to your account</p>

    <form [formGroup]="form" (ngSubmit)="handleSubmit()" novalidate aria-labelledby="login-form-title">
      <h3 id="login-form-title" class="visually-hidden">Login Form</h3>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email-input">Email Address<span aria-hidden="true">*</span></label>
        <div class="input-wrapper" [class.has-error]="hasFieldError('email')">
          <svg
            class="input-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M22 6L12 13L2 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <input
            id="email-input"
            type="email"
            formControlName="email"
            placeholder="user@gmail.com"
            [class.error]="hasFieldError('email')"
            autocomplete="off"
            [attr.aria-invalid]="hasFieldError('email')"
            [attr.aria-describedby]="hasFieldError('email') ? 'email-error' : null"
            aria-required="true"
          />
        </div>

        <div
          class="error-message"
          *ngIf="hasFieldError('email')"
          id="email-error"
          role="alert"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
            <line
              x1="12"
              y1="8"
              x2="12"
              y2="12"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <circle cx="12" cy="16" r="1" fill="currentColor" />
          </svg>
          {{ getFieldErrorMessage('email') }}
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password-input">Password<span aria-hidden="true">*</span></label>
        <div class="input-wrapper" [class.has-error]="hasFieldError('password')">
          <svg
            class="input-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <rect
              x="3"
              y="11"
              width="18"
              height="11"
              rx="2"
              ry="2"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M7 11V7C7 5.67392 7.52678 4.40215 8.46447 3.46447C9.40215 2.52678 10.6739 2 12 2C13.3261 2 14.5979 2.52678 15.5355 3.46447C16.4732 4.40215 17 5.67392 17 7V11"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <div class="password-field">
            <input
              id="password-input"
              [type]="isPasswordHidden ? 'password' : 'text'"
              formControlName="password"
              placeholder="••••••••"
              [class.error]="hasFieldError('password')"
              autocomplete="off"
              [attr.aria-invalid]="hasFieldError('password')"
              [attr.aria-describedby]="hasFieldError('password') ? 'password-error' : null"
              aria-required="true"
            />

            <button
              type="button"
              class="toggle-btn"
              (click)="togglePasswordVisibility()"
              aria-label="Toggle password visibility"
            >
              <svg
                *ngIf="isPasswordHidden"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="3"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <svg
                *ngIf="!isPasswordHidden"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M17.94 17.94C16.2306 19.243 14.1491 19.9649 12 20C5 20 1 12 1 12C2.24389 9.68192 3.96914 7.65663 6.06 6.06"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <line
                  x1="1"
                  y1="1"
                  x2="23"
                  y2="23"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div
          class="error-message"
          *ngIf="hasFieldError('password')"
          id="password-error"
          role="alert"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
            <line
              x1="12"
              y1="8"
              x2="12"
              y2="12"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <circle cx="12" cy="16" r="1" fill="currentColor" />
          </svg>
          {{ getFieldErrorMessage('password') }}
        </div>
      </div>

      <div class="extras">
        <label class="custom-checkbox" for="remember-me">
          <input
            id="remember-me"
            type="checkbox"
            formControlName="remember"
            autocomplete="off"
            aria-label="Remember me"
          />
          <span class="checkmark" aria-hidden="true"></span>
          <span class="label-text">Remember me</span>
        </label>

        <a class="forgot-link" routerLink="/auth/forgot-password">
          Forgot password?
        </a>
      </div>

   <button
  type="submit"
  class="login-btn"
  [disabled]="form.invalid"
  [attr.aria-disabled]="form.invalid"
>
  Log In
</button>

    </form>

    <div class="divider" role="separator" aria-label="Or continue with">Or continue with</div>
  </div>
</div>
