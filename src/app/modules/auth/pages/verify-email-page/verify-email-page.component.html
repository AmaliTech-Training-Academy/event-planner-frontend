<div class="forgot-container">
    <div class="form-card">
        
        <app-logo /> 

        <div class="title-group">
            <h2>Verify Your Account</h2>
            <p class="subtitle">Enter the 6-digit code sent to your email</p>
        </div>

        @if (apiMessage) {
            <div class="api-message" [ngClass]="{ 'success': !isError, 'error': isError }">
                {{ apiMessage }}
            </div>
        }

        <form (ngSubmit)="verifyAccount()">
            
            <div class="field verification-field"> 
                
                <app-otp-input 
                    [length]="6" 
                    (otpChange)="onOtpChange($event)">
                </app-otp-input>
                
                @if (apiMessage && isError) {
                    <app-form-error 
                        [message]="apiMessage" 
                        [showIcon]="true" 
                        [class.error-override]="true" />
                }
            </div>

            <app-button 
                [type]="'primary'" 
                [fullWidth]="true" 
                [disabled]="!isOtpComplete() || isLoading"
                (click)="verifyAccount()"
            >
                @if (!isLoading) {
                    <span>Verify</span>
                }
                @if (isLoading) {
                    <span class="spinner"></span>
                }
            </app-button>
        </form>
        
        <div class="resend-otp-wrapper">
            Didn't receive an OTP? 
            <a (click)="resendOtp()" [class.disabled]="isLoading" class="resend-link">Resend</a>
        </div>

    </div>
</div>
