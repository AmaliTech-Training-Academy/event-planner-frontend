<div class="forgot-container">
    <div class="form-card">
        
        <app-logo /> 

        <div class="title-group">
            <h2>Verify Your Account</h2>
            <p class="subtitle">Enter the 6-digit code sent to your email</p>
        </div>

        @if (apiMessage) {
            <div class="api-message" [ngClass]="{ 'success': !isError, 'error': isError }">
                {{ apiMessage }}
            </div>
        }

        <form (ngSubmit)="verifyAccount()">
            
            <div class="field verification-field"> 
                <div class="otp-input-group">
                    @for (digit of otp; track $index) {
                        <input 
                            type="text" 
                            maxlength="1" 
                            [ngModel]="digit" 
                            (ngModelChange)="otp[$index] = $event"
                            (input)="onOtpInput($event, $index)"
                            (keydown)="onKeyDown($event, $index)"
                            #otpInput
                            [name]="'otp-' + $index"
                            class="otp-digit-input"
                            inputmode="numeric" 
                            pattern="[0-9]"
                            [attr.aria-label]="'OTP digit ' + ($index + 1)">

                    }
                </div>
                
                @if (apiMessage && isError) {
                    <div class="error-container">
                        <img src="assets/icon/error-info.svg" alt="Error"/>
                        <span>{{ apiMessage }}</span> 
                    </div>
                }
            </div>

            <button 
                type="submit" 
                class="btn-primary" 
                [disabled]="!isOtpComplete() || isLoading">
                
                @if (!isLoading) {
                    <span>Verify</span>
                }
                @if (isLoading) {
                    <span class="spinner"></span>
                }
            </button>
        </form>
        
        <div class="resend-otp-wrapper">
            Didn't receive an OTP? 
            <a (click)="resendOtp()" [class.disabled]="isLoading" class="resend-link">Resend</a>
        </div>

    </div>
</div>
