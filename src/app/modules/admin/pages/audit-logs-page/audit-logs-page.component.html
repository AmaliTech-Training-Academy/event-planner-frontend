@if (isLoading()) {
  <div class="audit-logs-page__skeleton">
    <div class="skeleton-header">
      <div class="skeleton-title"></div>
      <div class="skeleton-actions">
        <div class="skeleton-button"></div>
        <div class="skeleton-button"></div>
      </div>
    </div>
    
    <div class="skeleton-filters">
      <div class="skeleton-search"></div>
      <div class="skeleton-filter"></div>
      <div class="skeleton-filter"></div>
    </div>
    
    <div class="skeleton-table">
      <div class="skeleton-table-header">
        <div class="skeleton-th" style="width: 5%"></div>
        <div class="skeleton-th" style="width: 30%"></div>
        <div class="skeleton-th" style="width: 25%"></div>
        <div class="skeleton-th" style="width: 20%"></div>
        <div class="skeleton-th" style="width: 20%"></div>
      </div>
      
      @for (item of [1,2,3,4,5,6,7,8]; track item) {
        <div class="skeleton-table-row">
          <div class="skeleton-td skeleton-checkbox"></div>
          <div class="skeleton-td" style="width: 30%"></div>
          <div class="skeleton-td" style="width: 25%"></div>
          <div class="skeleton-td" style="width: 20%"></div>
          <div class="skeleton-td" style="width: 20%"></div>
        </div>
      }
    </div>
    
    <div class="skeleton-pagination">
      <div class="skeleton-page-info"></div>
      <div class="skeleton-page-buttons">
        <div class="skeleton-page-button"></div>
        <div class="skeleton-page-button"></div>
        <div class="skeleton-page-button"></div>
      </div>
    </div>
  </div>
} @else {
  <app-data-table
    tableTitle="Audit Logs"
    [data]="auditLogs()"
    [columns]="columns"
    [filters]="filters"
    [showAvatar]="true"
    [searchable]="true"
    searchPlaceholder="Search users..."
    [showCheckboxes]="true"
    [showActionLabels]="false"
    [actions]="[]"
    [itemsPerPage]="10"
    [serverSidePagination]="false"
    [totalItems]="auditLogs().length"
  ></app-data-table>
}
