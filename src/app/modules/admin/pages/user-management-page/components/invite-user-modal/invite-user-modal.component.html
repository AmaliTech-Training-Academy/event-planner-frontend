<div class="modal-backdrop" (click)="onCancel()"></div>

<div class="modal">
  <app-modal-header
    title="Invite New User"
    (close)="onCancel()"
  ></app-modal-header>

  <form [formGroup]="inviteForm" (ngSubmit)="onSubmit()">
    <app-input
      formControlName="title"
      placeholder="Invitation Title"
      label="Invitation Title"
      [required]="true"
      [errorMessage]="
        hasError('title') ? getErrorMessage('title') : ''
      "
    ></app-input>

    <app-input
      type="email"
      label="Email"
      formControlName="email"
      placeholder="user@gmail.com"
      [required]="true"
      [errorMessage]="
        hasError('email') ? getErrorMessage('email') : ''
      "
    ></app-input>

    <label for="role">Select Role</label>
    <app-filter-select
      id="role"
      formControlName="role"
      [options]="roles"
      placeholder="Select Role"
      size="lg"
      [errorMessage]="
        hasError('role') ? getErrorMessage('role') : ''
      "
    ></app-filter-select>

    <label for="event">Select Event</label>
    <app-filter-select
      id="event"
      formControlName="event"
      [options]="events"
      placeholder="Select Event"
      size="lg"
      [errorMessage]="
        hasError('event') ? getErrorMessage('event') : ''
      "
    ></app-filter-select>

    <label for="message">Type Message (Optional)</label>
    <textarea
      id="message"
      formControlName="message"
      placeholder="Add a note for the invitee..."
    ></textarea>

    <div class="modal__actions">
      <app-button type="secondary" (click)="onCancel()">Cancel</app-button>
      <app-button
        type="primary"
        [disabled]="inviteForm.invalid"
        buttonType="submit"
      >
        Send Invite
      </app-button>
    </div>
  </form>
</div>
