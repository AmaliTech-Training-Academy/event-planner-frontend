<div class="modal-backdrop" (click)="onCancel()" aria-hidden="true"></div>

<div class="modal" role="dialog" aria-labelledby="inviteUserTitle">
   <app-modal-header
    [title]="'Invite New User'"
    (close)="onCancel()"
  ></app-modal-header>


  <form [formGroup]="inviteForm" (ngSubmit)="onSubmit()" novalidate>
    <!-- Invitation title -->
    <app-input
      formControlName="title"
      label="Invitation Title"
      placeholder="Enter invitation title"
      [required]="true"
      [errorMessage]="hasError('title') ? getErrorMessage('title') : ''"
    ></app-input>

    <!-- Email -->
    <app-input
      type="email"
      formControlName="email"
      label="Email Address"
      placeholder="user@gmail.com"
      [required]="true"
      [errorMessage]="hasError('email') ? getErrorMessage('email') : ''"
    ></app-input>

    <!-- Role selection -->
    <label for="role">Select Role</label>
    <app-filter-select
      id="role"
      formControlName="role"
      [options]="roles"
      placeholder="Select Role"
      size="lg"
      [errorMessage]="hasError('role') ? getErrorMessage('role') : ''"
    ></app-filter-select>

    <!-- Event selection -->
    <label for="event">Select Event</label>
    <app-filter-select
      id="event"
      formControlName="event"
      [options]="events"
      placeholder="Select Event"
      size="lg"
      [errorMessage]="hasError('event') ? getErrorMessage('event') : ''"
    ></app-filter-select>

    <!-- Optional message -->
    <label for="message">Type Message (Optional)</label>
    <textarea
      id="message"
      formControlName="message"
      rows="4"
      placeholder="Add a personal note..."
    ></textarea>

    <div class="modal__actions">
      <app-button type="secondary" (click)="onCancel()">Cancel</app-button>
      <app-button
        type="primary"
        buttonType="submit"
        [disabled]="inviteForm.invalid"
      >
        Send Invite
      </app-button>
    </div>
  </form>
</div>
