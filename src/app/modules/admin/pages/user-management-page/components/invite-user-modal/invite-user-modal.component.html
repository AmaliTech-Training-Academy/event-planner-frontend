<div class="modal-backdrop" (click)="onCancel()"></div>

<div class="modal">
  <h3 class="modal__title">Invite New User</h3>

  <form [formGroup]="inviteForm" (ngSubmit)="onSubmit()">
    <!-- Invitation title -->
    <app-input formControlName="title"    placeholder="Invitation Title"
        [required]="true" label="Invitation Title"></app-input>

    <app-input
      type="email"
      label="Email"
      formControlName="email"
      [required]="true"
      placeholder="user@gmail.com"
    ></app-input>

    <!-- Role selection -->
  <label for="role">Select Role</label>
<app-filter-select
  id="role"
  formControlName="role"
  [options]="roles"
  placeholder="Select Role"
  size="lg"
  [errorMessage]="
    inviteForm.get('role')?.touched && inviteForm.get('role')?.hasError('required')
      ? 'Role is required'
      : null
  "
></app-filter-select>

<label for="event">Select Event</label>
<app-filter-select
  id="event"
  formControlName="event"
  [options]="events"
  placeholder="Select Event"
  size="lg"
  [errorMessage]="
    inviteForm.get('event')?.touched && inviteForm.get('event')?.hasError('required')
      ? 'Event is required'
      : null
  "
></app-filter-select>


    <!-- Optional message -->
    <label for="message">Type Message (Optional)</label>
    <textarea id="message" formControlName="message"></textarea>

    <!-- Actions -->
    <div class="modal__actions">
      <app-button type="secondary" (click)="onCancel()">Cancel</app-button>
      <app-button
        type="primary"
        [disabled]="inviteForm.invalid"
        (click)="onSubmit()"
      >
        Send Invite
      </app-button>
    </div>
  </form>
</div>
