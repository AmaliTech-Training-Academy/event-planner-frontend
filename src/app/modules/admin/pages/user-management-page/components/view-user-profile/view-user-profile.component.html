<div class="modal-backdrop" (click)="onClose()"></div>

<div class="modal modal--profile">
  <app-modal-header
    title="User Profile Information"
    (close)="onClose()"
  ></app-modal-header>

  <div class="modal__content" *ngIf="userData() as user">
    <div class="profile-section">
      <div class="profile-avatar">
        <img
          [ngSrc]="profileImage()"
          alt="Profile picture"
          width="128"
          height="128"
          priority
        />
        <app-button
          type="plain"
          [extraClass]="'status-button'"
          size="small"
          class="status-button"
        >
          <span class="button-content">
           
          </span>
        </app-button>
      </div>
      <div class="profile-info">
        <h3>{{ fullName() }}</h3>
        <p class="user-role">{{ user.role }}</p>
      </div>
    </div>

    <div class="info-section">
      <h4 class="section-title">Basic Information</h4>
      <div class="info-grid">
        <div class="info-item">
          <label class="info-label">Full Name</label>
          <p class="info-value">{{ fullName() }}</p>
        </div>
        <div class="info-item">
          <label class="info-label">Email Address</label>
          <p class="info-value">{{ email() }}</p>
        </div>
      </div>
    </div>

    <div class="info-section">
      <h4 class="section-title">Contact Information</h4>
      <div class="info-grid">
        <div class="info-item">
          <label class="info-label">Phone Number</label>
          <p class="info-value">{{ phoneDisplay() }}</p>
        </div>
        <div class="info-item">
          <label class="info-label">Address</label>
          <p class="info-value">{{ address() }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="modal__actions">
    <app-button type="secondary" (click)="onEdit()"> Edit Profile </app-button>
    <app-button
      [type]="isActive() ? 'danger' : 'success'"
      (click)="onToggleStatus()"
    >
      {{ statusButtonText() }}
    </app-button>
  </div>
</div>
