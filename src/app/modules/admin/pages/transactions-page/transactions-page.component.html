<div class="transactions-page">
  <div class="transactions-page__header">
    <div class="transactions-page__header-content">
      <h1 class="transactions-page__title">Transaction History</h1>
      <p class="transactions-page__subtitle">
        View and manage all payment transactions
      </p>
    </div>
    <div class="transactions-page__user-icon">
      <img src="icons/users-icon.png" alt="Users" />
    </div>
  </div>

 

  <div class="transactions-page__content">
    <app-data-table tableTitle=""
      [data]="transactions()" 
      [columns]="tableColumns" 
      [actions]="tableActions" 
      [filters]="tableFilters"
      [searchable]="true" 
      [expandable]="false" 
      [itemsPerPage]="10" 
      [emptyState]="transactionsEmptyState"
      [serverSidePagination]="true" 
      [totalItems]="totalElements()" 
      [loading]="isLoading()"
      (pageChange)="onPageChange($event)" 
      (filterChange)="onFilterChange($event)"
      (searchChange)="onSearch($event)" />
  </div>
</div>
