<div class="modal-overlay" (click)="handleCancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <app-modal-header
      title="Invite New User"
      (close)="onCancel()"
    ></app-modal-header>

    <form [formGroup]="form" (ngSubmit)="handleSubmit()">
      <div class="modal-body">
        <div class="form-field">
          <label for="fullName">Full Name</label>
          <app-input
            id="fullName"
            formControlName="fullName"
            placeholder="Enter full name"
            [errorMessage]="
              hasFieldError('fullName') ? getFieldErrorMessage('fullName') : ''
            "
          ></app-input>
        </div>

        <div class="form-field">
          <label for="email">Email Address</label>
          <app-input
            id="email"
            type="email"
            formControlName="email"
            placeholder="Enter email address"
            [errorMessage]="
              hasFieldError('email') ? getFieldErrorMessage('email') : ''
            "
          ></app-input>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <app-input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Enter password"
            [errorMessage]="
              hasFieldError('password') ? getFieldErrorMessage('password') : ''
            "
          ></app-input>
        </div>

        <div class="form-field">
          <label for="confirmPassword">Confirm Password</label>
          <app-input
            id="confirmPassword"
            type="password"
            formControlName="confirmPassword"
            placeholder="Confirm password"
            [errorMessage]="
              hasFieldError('confirmPassword')
                ? getFieldErrorMessage('confirmPassword')
                : ''
            "
          ></app-input>
        </div>

        <!--  ✅ Secure text at the bottom, like login page -->
        <app-secure-text></app-secure-text>
      </div>

      <div class="modal-footer">
        <app-button
          type="secondary"
          buttonType="button"
          (onClick)="handleCancel()"
          [disabled]="isSubmitting()"
        >
          Cancel
        </app-button>
        <app-button
          type="primary"
          buttonType="submit"
          [disabled]="isSubmitting()"
        >
          {{ isSubmitting() ? "Adding..." : "Add Team Member" }}
        </app-button>
      </div>
    </form>
  </div>
</div>
