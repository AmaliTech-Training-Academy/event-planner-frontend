<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal">
    <app-modal-header
      title="View Saved Invite"
      (close)="onClose()">
    </app-modal-header>

    <div class="modal__content" *ngIf="inviteData() as invite">
      <div class="info-section">
        <h4 class="section-title">Invitation Details</h4>
        <div class="info-grid">
          <div class="info-item">
            <label class="info-label">Invitation Title</label>
            <p class="info-value">{{ invite.invitationTitle }}</p>
          </div>
          <div class="info-item">
            <label class="info-label">Event</label>
            <p class="info-value">{{ invite.event }}</p>
          </div>
        </div>
      </div>

      <div class="info-section">
        <h4 class="section-title">Metadata</h4>
        <div class="info-grid">
          <div class="info-item">
            <label class="info-label">Event ID</label>
            <p class="info-value">{{ invite.eventId }}</p>
          </div>

          <div class="info-item">
            <label class="info-label">Created By</label>
            <p class="info-value">{{ invite.createdBy }}</p>
          </div>

          <div class="info-item">
            <label class="info-label">Last Edited</label>
            <p class="info-value">{{ invite.lastEdited }}</p>
          </div>

          <div class="info-item">
            <label class="info-label">Recipients</label>
            <p class="info-value info-value--highlight">
              {{ invite.recipients }}
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="modal__actions">
      <app-button type="secondary" (click)="onClose()">Close</app-button>
    </div>
  </div>
</div>
