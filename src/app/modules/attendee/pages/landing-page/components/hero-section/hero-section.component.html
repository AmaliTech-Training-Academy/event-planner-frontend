<section class="hero">
  <div class="hero__container container">
    <div class="hero__content">
      <h1 class="hero__title">{{ _title() }}</h1>
      <p class="hero__subtitle">{{ _subtitle() }}</p>

      <div class="hero__actions">
        <app-button
          label="Create An Event"
          type="primary"
          (clicked)="_onCreateEvent()"
        ></app-button>

        <app-button
          label="View Events"
          type="secondary"
          (clicked)="_onViewEvents()"
        ></app-button>
      </div>
    </div>

    <div class="hero__image-wrapper">
      <div class="hero__image-container">
        <img
          [src]="_heroImage()"
          alt="Professional woman in video conference"
          class="hero__image"
          loading="eager"
        />

        <div class="hero__overlay-icons">
          <button class="hero__icon" aria-label="Microphone">
            <img
              [src]="_icons().mic"
              alt="Microphone"
              class="hero__icon-content"
            />
          </button>

          <button class="hero__icon" aria-label="Video camera">
            <img
              [src]="_icons().video"
              alt="Video camera"
              class="hero__icon-content"
            />
          </button>

          <button
            class="hero__icon hero__icon--accent icon-red"
            aria-label="Phone call"
          >
            <img
              [src]="_icons().phone"
              alt="Phone"
              class="hero__icon-content"
            />
          </button>

          <button class="hero__icon" aria-label="Email">
            <img [src]="_icons().mail" alt="Email" class="hero__icon-content" />
          </button>

          <button class="hero__icon" aria-label="Settings">
            <img
              [src]="_icons().settings"
              alt="Settings"
              class="hero__icon-content"
            />
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
