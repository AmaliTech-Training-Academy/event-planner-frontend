<section class="hero">
  <div class="hero__container container">
    <div class="hero__content">
      <h1 class="hero__title">{{ title }}</h1>
      <p class="hero__subtitle">{{ subtitle }}</p>

      <div class="hero__actions">
        <app-button
          type="primary"
          label="Create an event"
          (click)="onCreateEvent()"
        >
          Create An Event
        </app-button>

        <app-button
          type="social"
          label="View events"
          (click)="onViewEvents()"
        >
          View Events
        </app-button>
      </div>
    </div>

    <div class="hero__image-wrapper">
      <div class="hero__image-container">
        <img
          [ngSrc]="heroImage"
          alt="Professional woman in video conference"
          width="700"
          height="500"
          class="hero__image"
          priority
        />

        <div class="hero__overlay-icons">
          <button class="hero__icon" aria-label="Microphone">
            <img
              [ngSrc]="icons.mic"
              alt="Microphone"
              width="40"
              height="40"
              class="hero__icon-content"
              loading="lazy"
            />
          </button>

          <button class="hero__icon" aria-label="Video camera">
            <img
              [ngSrc]="icons.video"
              alt="Video camera"
              width="40"
              height="40"
              class="hero__icon-content"
              loading="lazy"
            />
          </button>

          <button
            class="hero__icon hero__icon--accent icon-red"
            aria-label="Phone call"
          >
            <img
              [ngSrc]="icons.phone"
              alt="Phone"
              width="40"
              height="40"
              class="hero__icon-content"
              loading="lazy"
            />
          </button>

          <button class="hero__icon" aria-label="Email">
            <img
              [ngSrc]="icons.mail"
              alt="Email"
              width="40"
              height="40"
              class="hero__icon-content"
              loading="lazy"
            />
          </button>

          <button class="hero__icon" aria-label="Settings">
            <img
              [ngSrc]="icons.settings"
              alt="Settings"
              width="40"
              height="40"
              class="hero__icon-content"
              loading="lazy"
            />
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
