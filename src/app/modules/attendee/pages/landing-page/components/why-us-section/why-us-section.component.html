<section class="why-us">
  <div class="why-us__container container">
    <div class="why-us__content">
      <span class="why-us__label">{{ _sectionLabel() }}</span>
      <h2 class="why-us__title">{{ _title() }}</h2>

      <div class="why-us__features">
        @for (feature of _features(); track _trackByFeature($index, feature)) {
        <div class="why-us__feature">
          <div class="why-us__check-icon">
            <img src="icons/check-mark.svg" alt="checkmark" />
          </div>
          <span class="why-us__feature-text">{{ feature.text }}</span>
        </div>
        }
      </div>
    </div>

    <div class="why-us__image-wrapper">
      <div class="why-us__phone-container">
        <div class="why-us__phone-frame">
          <div class="why-us__phone-notch"></div>
          <img
            [src]="_phoneImage()"
            alt="Mobile app interface"
            class="why-us__phone-image"
            loading="lazy"
          />
        </div>
      </div>
    </div>
  </div>
</section>
