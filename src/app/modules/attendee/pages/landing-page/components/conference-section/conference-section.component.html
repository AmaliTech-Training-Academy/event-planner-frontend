<section class="conference">
  <div class="conference__container">
    <div class="conference__header">
      <h2 class="conference__title">{{ _title() }}</h2>
      <p class="conference__subtitle">{{ _subtitle() }}</p>
    </div>

    <div class="conference__video-wrapper">
      <div class="conference__video-container">
        <img 
          [src]="_conferenceImage()" 
          alt="Professional woman in virtual conference call" 
          class="conference__image"
          loading="lazy">
      </div>
    </div>
  </div>
</section>
