<main class="my-events-content">

  <div class="page-header">
    <h1 class="page-title">My Events</h1>
  </div>


  <div class="stat-card-grid">
    @for (card of statCards(); track card.title) {
    <app-admin-user-card [data]="card" />
    }
  </div>


  <div class="events-section">

    <app-empty-list-message (handleSecondary)="navigateToExploreEvent()" (handleAction)="navigateToCreateEvent()" [secondaryText]="'Explore Events'" [actionText]="'Create Event'"></app-empty-list-message>

    <div class="event-grid">
      @for (event of myEvents(); track event.id;) {
      <app-event-card  [event]="event" [variant]="'manage'" (manageEvent)="onManageEvent()" />
      }
    </div>
    <app-pagination [totalItems]="totalaPages()" [(currentPage)]="page"></app-pagination>
  </div>

</main>
