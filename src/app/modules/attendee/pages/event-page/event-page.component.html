<main class="event-page-content">
  <a routerLink="/explore" class="back-link">
    <img src="icons/Navigation1.png" alt="" class="back-icon" />
    Back to events
  </a>

  <section class="hero-section">
    <img
      [src]="eventDetails?.heroImageUrl"
      [alt]="eventDetails?.title"
      class="hero-image"
    />
    <div class="hero-overlay">
      <h1 class="hero-title">{{ eventDetails?.title }}</h1>
      <div class="hero-details">
        <span class="hero-detail-item">
          <img src="icons/Mixed.png" alt="Date" class="hero-icon" />
          <span>{{ eventDetails?.date }}</span>
        </span>

        <span class="hero-detail-item">
          <img src="icons/room.png" alt="Location" class="hero-icon" />
          <span>{{ eventDetails?.location }}</span>
        </span>
      </div>
      @if (eventDetails?.isPaid) {
      <span class="hero-badge">Paid</span>
      }
    </div>
  </section>

  <div class="content-grid">
    <div class="left-column">
      <section class="about-section">
        <h2>About The Event</h2>
        <p>{{ eventDetails?.description }}</p>
        <div class="attendees-info">
          <img src="icons/Frame.png" alt="Attendees" class="attendees-icon" />
          {{ eventDetails?.attendeesCount }} Attendees
        </div>
      </section>

      @if (venueImages && venueImages.length > 0) {
      <app-venue-image-slider [images]="venueImages"></app-venue-image-slider>
      }
    </div>

    <div class="right-column">
      <app-ticket-card [ticketInfo]="ticketInfo" (registerClick)="onRegister()">
      </app-ticket-card>

      <app-help-card [email]="helpEmail"></app-help-card>
    </div>
  </div>
</main>
