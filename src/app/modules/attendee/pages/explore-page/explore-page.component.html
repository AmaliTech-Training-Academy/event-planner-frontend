
<main class="explore-page-content">

  <section class="filter-bar">
    
    
    <div class="filter-input-wrapper search-wrapper">
      <img src="icons/Vector1.png" class="filter-icon" alt="Search" />
      <input 
        type="text" 
        placeholder="Search events..." 
        class="filter-search"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange()"
      />
    </div>

   
    <div class="secondary-filters-group">
      <div class="filter-dropdown-wrapper location-filter-wrapper">
        <button class="filter-input-wrapper filter-button" (click)="toggleLocationDropdown()">
          <span>{{ selectedLocation }}</span>
          <img src="icons/room.png" class="filter-icon" alt="Location" />
        </button>
        
        @if (showLocationDropdown) {
          <app-location-dropdown
            [recentSearches]="recentSearches"
            [popularLocations]="popularLocations"
            (locationSelected)="onLocationSelected($event)"
            (useCurrentLocation)="onUseCurrentLocation()"
            (close)="closeLocationDropdown()">
          </app-location-dropdown>
        }
      </div>
      
      
      <div class="filter-dropdown-wrapper event-type-filter-wrapper">
        <button class="filter-input-wrapper filter-button" (click)="toggleEventTypeDropdown()">
          <span>{{ selectedEventType }}</span>
          <img src="icons/Vector.png" class="filter-icon" alt="Select Type" />
        </button>

        @if (showEventTypeDropdown) {
          <app-filter-dropdown
            [options]="eventTypeOptions"
            [selectedOption]="selectedEventType"
            (optionSelected)="onEventTypeSelected($event)"
            (close)="closeEventTypeDropdown()">
          </app-filter-dropdown>
        }
      </div>
      
      
      <div class="filter-input-wrapper date-wrapper">
        <img src="icons/Mixed.png" class="filter-icon" alt="Date" />
        <input type="date" class="filter-date" required />
      </div>
    </div>
   

  </section>
  
  <app-tab-toggle 
    [tabs]="eventToggles" 
    [activeTabKey]="activeToggle"
    (tabSelected)="onTabChange($event)">
  </app-tab-toggle>

 
  <section class="event-section">
    <h2>Paid Events</h2>
    <div class="event-grid">
      @for (event of paidEvents.slice(0, 6); track event.id) {
        <app-event-card
          [imageUrl]="event.imageUrl"
          [date]="event.date"
          [title]="event.title"
          [location]="event.location"
          [attendees]="event.attendees"
          [isPaid]="true">
        </app-event-card>
      }
    </div>
  </section>

 
  <div class="load-more-container">
    <app-button
      class="load-more-btn"
      [type]="'primary'"
      (click)="onLoadMorePaid()">
      Load More Event
    </app-button>
  </div>

 
  <section class="event-section">
    <h2>Free Events</h2>
    <div class="event-grid">
      @for (event of freeEvents.slice(0, 6); track event.id) {
        <app-event-card
          [imageUrl]="event.imageUrl"
          [date]="event.date"
          [title]="event.title"
          [location]="event.location"
          [attendees]="event.attendees"
          [isPaid]="false">
        </app-event-card>
      }
    </div>
  </section>

 
  <div class="load-more-container">
    <app-button
      class="load-more-btn"
      [type]="'primary'"
      (click)="onLoadMoreFree()">
      Load More Event
    </app-button>
  </div>
</main>
