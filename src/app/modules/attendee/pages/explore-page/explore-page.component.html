<section class="explore-page-content">
  <div class="container">
    <div class="filter-bar">

      <div class="search-wrapper">
        <app-search-input [placeholder]="'Search events...'" [(ngModel)]="searchQuery"
          (ngModelChange)="onSearchChange($event)"></app-search-input>
      </div>

      <div class="secondary-filters-group">

        <div class="filter-dropdown-wrapper" (click)="$event.stopPropagation()">
          <div class="filter-button-wrapper">
            <app-location-search (focus)="onFocusHandler()" [(ngModel)]="locationTerm"
              label="" />
          </div>

          @if (showLocationDropdown()) {
          <app-location-dropdown
            (close)="closeLocationDropdown()" (locationSelected)="onLocationSelected($event)"
           ></app-location-dropdown>
          }
        </div>


        <div class="filter-dropdown-wrapper" (click)="$event.stopPropagation()">
          <div class="filter-button-wrapper">
            <app-button type="secondary" [extraClass]="'filter-button'" (onClick)="toggleEventTypeDropdown()">
              <div class="filter-content">
                <span [class.is-placeholder]="selectedEventType().label === 'All Events'">
                  {{ selectedEventType().label }}
                </span>
                <img src="icons/Vector.png" alt="" class="filter-icon" />
              </div>
            </app-button>
          </div>

          @if (showEventTypeDropdown()) {
          <app-filter-dropdown [options]="eventTypeOptions()" [selectedOption]="selectedEventType()"
            (close)="closeEventTypeDropdown()" (optionSelected)="onEventTypeSelected($event)"></app-filter-dropdown>
          }
        </div>


        <div class="filter-dropdown-wrapper" (click)="$event.stopPropagation()">
          <div class="filter-button-wrapper">
            <app-button type="secondary" [extraClass]="'filter-button'" (onClick)="toggleDatePicker()">
              <div class="filter-content">
                <span [class.is-placeholder]="!selectedDate()">
                  @if (selectedDate(); as date) {
                  {{ date | date : 'MMM d, y' }}
                  } @else {
                  Date
                  }
                </span>
                <img src="icons/Mixed.png" alt="" class="filter-icon" />
              </div>
            </app-button>
          </div>

          @if (showDatePicker()) {
          <div class="date-picker-dropdown">
            <app-date-picker (dateSelected)="onDateSelected($event)"></app-date-picker>
          </div>
          }
        </div>
      </div>
    </div>

    <app-tab-toggle [toggles]="eventToggles()" [activeToggle]="activeToggle()"
      (tabChange)="onTabChange($event)"></app-tab-toggle>

    <section class="event-section">
      <div class="event-grid">
        @for (event of allEvents()?.events || []; track $index) {
        <app-event-card [event]="event" [variant]="'explore'"></app-event-card>
        }
      </div>
    </section>

  </div>
</section>
