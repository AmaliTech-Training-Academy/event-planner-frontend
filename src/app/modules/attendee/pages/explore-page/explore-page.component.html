<main class="explore-page-content">

  <section class="filter-bar">
    <app-search-input
      class="filter-input-wrapper search-wrapper"
      style="height: 48px;" 
      iconPath="icons/Vector1.png"
      placeholder="Search events..."
      [(value)]="searchQuery"
      (valueChange)="onSearchChange()">
    </app-search-input>
    
    <div class="secondary-filters-group">
      
     
      <div class="filter-dropdown-wrapper location-filter-wrapper">
        
        <app-filter-button
          class="filter-button filter-input-wrapper" 
          [text]="selectedLocation"
          [isPlaceholder]="selectedLocation === 'Location'"
          iconPath="icons/room.png"
          (click)="toggleLocationDropdown()">
        </app-filter-button>
        
        @if (showLocationDropdown) {
          <app-location-dropdown
            [recentSearches]="recentSearches"
            [popularLocations]="popularLocations"
            (locationSelected)="onLocationSelected($event)"
            (useCurrentLocation)="onUseCurrentLocation()"
            (close)="closeLocationDropdown()">
          </app-location-dropdown>
        }
      </div>
      
     
      <div class="filter-dropdown-wrapper event-type-filter-wrapper">
        <app-filter-button
          class="filter-button filter-input-wrapper"
          [text]="selectedEventType"
          [isPlaceholder]="selectedEventType === 'All Events'"
          iconPath="icons/Vector.png"
          (click)="toggleEventTypeDropdown()">
        </app-filter-button>

        @if (showEventTypeDropdown) {
          <app-filter-dropdown
            [options]="eventTypeOptions"
            [selectedOption]="selectedEventType"
            (optionSelected)="onEventTypeSelected($event)"
            (close)="closeEventTypeDropdown()">
          </app-filter-dropdown>
        }
      </div>
      
      
      <div class="filter-input-wrapper date-wrapper">
        <img 
          ngSrc="icons/Mixed.png" 
          class="filter-icon" 
          alt="Date" 
          width="16" 
          height="16" 
        />
        <input 
          type="text" 
          class="filter-date" 
          required 
          placeholder="Date" 
          onfocus="(this.type='date')"
          onblur="if(!this.value) this.type='text'"
        />
      </div>
    </div>

  </section>
  
  

  <app-tab-toggle 
    [tabs]="eventToggles" 
    [activeTabKey]="activeToggle"
    (tabSelected)="onTabChange($event)">
  </app-tab-toggle>

  <section class="event-section">
    <h2>Paid Events</h2>
    <div class="event-grid">
      @for (event of paidEvents.slice(0, 6); track event.id) {
        
        <app-event-card [event]="event"></app-event-card>
      }
    </div>
  </section>

  <div class="load-more-container">
    <app-button
      class="load-more-btn"
      [type]="'primary'"
      (onClick)="onLoadMorePaid()">
      Load More Event
    </app-button>
  </div>

  <section class="event-section">
    <h2>Free Events</h2>
    <div class="event-grid">
      @for (event of freeEvents.slice(0, 6); track event.id) {
        
        <app-event-card [event]="event"></app-event-card>
      }
    </div>
  </section>

  <div class="load-more-container">
    <app-button
      class="load-more-btn"
      [type]="'primary'"
      (onClick)="onLoadMoreFree()">
      Load More Event
    </app-button>
  </div>
</main>
