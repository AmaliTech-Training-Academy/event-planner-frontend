<form [formGroup]="profileForm" class="profile-page-content">

  <div class="profile-card">
    <h1 class="page-title">Profile Information</h1>

    <!-- Header -->
    <header class="profile-header">
      <div class="avatar">
        <img [ngSrc]="avatarUrl()" [alt]="'Avatar'" width="64" height="64" priority />
      </div>
      <div class="header-text">
        <h1>Edit Profile</h1>
        <p>Update your personal information</p>
      </div>
    </header>

    <!-- Basic Information Section -->
    <section formGroupName="basicInfo" class="info-section">
      <div class="section-header">
        <h2>Basic Information</h2>
      </div>
      <div class="form-grid">
        <app-input [errorMessage]="hasError('fullName','basicInfo')" formControlName="fullName" label="Full Name" placeholder="Enter your full name" name="fullName"></app-input>
        <app-input [errorMessage]="hasError('email','basicInfo')" formControlName="email" label="Email Address" type="email" placeholder="Enter your email" name="email"></app-input>
      </div>
      <div class="edit-button-container">
        <app-button type="secondary" [extraClass]="'edit-button'" (click)="onEditBasicInfo()">
          {{ basicInfoButtonText() }}
        </app-button>
      </div>
    </section>

    <!-- Contact Information Section -->
    <section formGroupName="contactInfo" class="info-section">
      <div class="section-header">
        <h2>Contact Information</h2>
      </div>
      <div class="form-grid">
        <app-input [errorMessage]="hasError('phone','contactInfo')" formControlName="phone" label="Phone Number" placeholder="Enter your phone number" name="phone"></app-input>
        <app-input [errorMessage]="hasError('address','contactInfo')" formControlName="address" label="Address" placeholder="Enter your address" name="address"></app-input>
      </div>
      <div class="edit-button-container">
        <app-button type="secondary" [extraClass]="'edit-button'" (click)="onEditContactInfo()">
          {{ contactInfoButtonText() }}
        </app-button>
      </div>
    </section>

    <!-- Footer -->
    <footer class="profile-footer">
      <app-button type="plain" [extraClass]="'logout-button'" (click)="onLogout()">
        <img [ngSrc]="'icons/logout.png'" alt="Logout icon" width="18" height="18" priority />
        Logout
      </app-button>
    </footer>

  </div>
</form>
