<section class="partners" role="region" aria-label="Our Partners">
  <div class="partners__container">
    <div class="partners__track">
      @for (partner of _partners(); track _trackByPartnerName($index, partner)) {
        <div class="partners__item">
          <img 
            [src]="partner.imageUrl" 
            [alt]="partner.name + ' logo'" 
            class="partners__image"
            loading="lazy"
            [attr.aria-label]="partner.name">
        </div>
      }
    </div>
  </div>
</section>
