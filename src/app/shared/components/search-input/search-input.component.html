<div class="filter-input-wrapper search-wrapper">
 
  <img
    src="icons/search-icon.png"
    alt="Search"
    class="filter-icon"
    aria-hidden="true"
  />

  <input
    type="text"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="onValueChange($event)"
    (blur)="onBlur()"
    class="filter-search"
  />
</div>
