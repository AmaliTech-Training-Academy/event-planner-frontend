<header class="header">
  <div class="header__container container">
    <!-- Logo -->
    <div class="header__logo">
      <span class="header__logo--orange">Event</span>
      <span class="header__logo--black">Hub</span>
    </div>

    <!-- Navigation -->
    <nav class="header__nav" [class.open]="isMenuOpen()">
      <a
        *ngFor="let link of navLinks()"
        [routerLink]="link.path"
        routerLinkActive="active"
        class="header__link"
        (click)="closeMenu()"
      >
        <img [src]="link.icon" alt="{{ link.label }} icon" class="header__icon"/>
        <span>{{ link.label }}</span>
      </a>

      <div class="header__actions">
        <button class="header__btn">Sign In</button>
      </div>
    </nav>

    <!-- Hamburger outside nav -->
    <button class="header__hamburger" (click)="toggleMenu()">
      <img src="assets/icons/menu.svg" alt="Menu" class="header__icon"/>
    </button>
  </div>
</header>
