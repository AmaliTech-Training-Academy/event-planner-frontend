<div class="selector">
    <div class="options" role="list">
        @for (time of timeSlots; track $index) {
            <button (click)="timeSelected(time)" class="option" role="listitem">
                {{time}}
            </button>

            @if ($index != timeSlots.length-1) {
                <hr>
            }
        }
    </div>
</div>
