<div class="event-card">
  <img [src]="event.imageUrl" [alt]="event.title" class="event-card__image" />
  
  <div class="event-card__pills">
    @if (event.isPaid) {
      <span class="event-card__pill event-card__pill--paid">Paid</span>
    } @else {
      <span class="event-card__pill event-card__pill--free">Free</span>
    }
  </div>

  <div class="event-card__content">
    <div class="event-card__date">
      {{ event.date }}
    </div>
    <h3 class="event-card__title">{{ event.title }}</h3>
    <div class="event-card__location">
      <span class="event-card__icon">📍</span>
      {{ event.location }}
    </div>
    <div class="event-card__attendees">
      <span class="event-card__icon">👥</span>
      {{ event.attendees }} attendees
    </div>
  </div>

  <div class="event-card__footer">
    <app-button (click)="navigateToDetails()">
      View Details
    </app-button>
  </div>
</div>
