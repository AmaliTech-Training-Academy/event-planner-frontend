<article class="event-card">
  <div class="event-card__image-wrapper">
    <img 
      [src]="event().imageUrl" 
      [alt]="event().title" 
      class="event-card__image"
      loading="lazy">
    <span class="event-card__badge" [class.event-card__badge--paid]="event().isPaid">
      {{ event().isPaid ? 'Paid' : 'Free' }}
    </span>
  </div>
  
  <div class="event-card__content">
    <div class="event-card__meta">
      <div class="event-card__meta-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" class="event-card__icon">
          <path d="M12.6667 2.66667H3.33333C2.59695 2.66667 2 3.26362 2 4V13.3333C2 14.0697 2.59695 14.6667 3.33333 14.6667H12.6667C13.403 14.6667 14 14.0697 14 13.3333V4C14 3.26362 13.403 2.66667 12.6667 2.66667Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10.6667 1.33333V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5.33333 1.33333V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 6.66667H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="event-card__meta-text">{{ event().date }}</span>
      </div>
    </div>
    
    <h3 class="event-card__title">{{ event().title }}</h3>
    
    <div class="event-card__details">
      <div class="event-card__detail">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" class="event-card__icon">
          <path d="M7 7.66667C8.47276 7.66667 9.66667 6.47276 9.66667 5C9.66667 3.52724 8.47276 2.33333 7 2.33333C5.52724 2.33333 4.33333 3.52724 4.33333 5C4.33333 6.47276 5.52724 7.66667 7 7.66667Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 12.8333C9.33333 10.5 12.8333 8.98367 12.8333 5.66667C12.8333 2.90024 10.7665 0.833333 8 0.833333C5.23357 0.833333 3.16667 2.90024 3.16667 5.66667C3.16667 8.98367 6.66667 10.5 9 12.8333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="event-card__detail-text">{{ event().location }}</span>
      </div>
      
      <div class="event-card__detail">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" class="event-card__icon">
          <path d="M9.66667 12.8333C11.1394 12.8333 12.3333 11.6394 12.3333 10.1667C12.3333 8.69391 11.1394 7.5 9.66667 7.5C8.19391 7.5 7 8.69391 7 10.1667C7 11.6394 8.19391 12.8333 9.66667 12.8333Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4.33333 5.66667C5.80609 5.66667 7 4.47276 7 3C7 1.52724 5.80609 0.333333 4.33333 0.333333C2.86057 0.333333 1.66667 1.52724 1.66667 3C1.66667 4.47276 2.86057 5.66667 4.33333 5.66667Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="event-card__detail-text">{{ event().attendees }} attendees</span>
      </div>
    </div>
    
    <button 
      class="event-card__button" 
      (click)="_onViewDetails()"
      type="button">
      View Details
    </button>
  </div>
</article>
