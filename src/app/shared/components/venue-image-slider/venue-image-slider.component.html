<div class="slider-container">
  <!-- Title and Navigation -->
  <div class="slider-header">
    <h2 class="slider-title">Venue Images</h2>
    <div class="slider-nav">
      <!-- Previous Button -->
      <button 
        class="nav-arrow" 
        (click)="prev()"
        [disabled]="isPrevDisabled"
        aria-label="Previous image">
        <img src="assets/icons/arrow-left.svg" alt="Previous" />
      </button>
      <!-- Next Button -->
      <button 
        class="nav-arrow" 
        (click)="next()"
        [disabled]="isNextDisabled"
        aria-label="Next image">
        <img src="assets/icons/arrow-right.svg" alt="Next" />
      </button>
    </div>
  </div>

  <!-- Image Gallery -->
  <div class="image-list-wrapper"> <!-- This is the "frame" -->
    <div 
      class="image-list"   that moves -->
      [style.transform]="'translateX(' + (-currentIndex * slideWidthPercentage) + '%)'"> 
      
      @for (image of images; track image.url) {
        <!-- This is the "slide" -->
        <div class="image-slide"> 
          <img [src]="image.url" [alt]="image.alt" class="venue-image" />
        </div>
      }
    </div>
  </div>
</div>
