<header class="admin-top-nav" role="banner">
  <div class="admin-top-nav__left">
    <img
      [src]="logoSrcSig()"
      [alt]="logoAltSig()"
      class="admin-top-nav__logo"
    />
    <span class="admin-top-nav__page-title">{{ pageTitleSig() }}</span>
  </div>

  <div class="admin-top-nav__right">
    <button
      class="admin-top-nav__notifications"
      type="button"
      [attr.aria-label]="'Notifications'"
    >
      <img src="icons/notification-icon.png" alt="Notifications" />
      @if (hasNotifications()) {
        <span class="admin-top-nav__badge">
          {{ notificationsCount }}
        </span>
      }
    </button>

    <div class="admin-top-nav__user" [attr.aria-label]="userName">
      <img
        [src]="avatarSrcSig()"
        [alt]="userNameSig()"
        class="admin-top-nav__avatar"
      />
    </div>
  </div>
</header>
