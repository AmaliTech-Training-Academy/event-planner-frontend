<div class="filter-select" [ngClass]="filterClass()">
  <div
    class="filter-select__dropdown"
    tabindex="0"
    role="button"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-disabled]="isDisabled()"
    (click)="toggleDropdown()"
    (keydown)="onKeydown($event)"
  >
    <span class="filter-select__selected">{{ selectedLabel() }}</span>

    <div class="filter-select__actions">
      @if (showReset() && hasValue() && !isDisabled()) {
        <button
          class="filter-select__reset"
          type="button"
          (click)="resetFilter($event)"
          aria-label="Reset filter"
          title="Reset filter"
        >
          <img src="icons/close.png" alt="">
        </button>
      }

      <img 
        class="filter-select__icon" 
        [class.open]="isOpen()"
        src="icons/drop-down.png" 
        alt=""
      >
    </div>
  </div>

  @if (isOpen() && !isDisabled()) {
    <ul class="filter-select__menu" role="listbox" aria-label="Filter options">
      @for (option of options(); track option.value) {
        <li
          class="filter-select__option"
          role="option"
          (click)="selectOption(option)"
          [class.active]="option?.value === value() || isActive($index)"
          [attr.aria-selected]="option?.value === value()"
        >
          {{ option?.label }}
        </li>
      } @empty {
        <li class="filter-select__empty" role="presentation">
          No options available
        </li>
      }
    </ul>
  }

  <app-form-error [message]="errorMessage()"></app-form-error>
</div>
