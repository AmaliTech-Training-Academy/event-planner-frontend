<div class="filter-select">
  <select
    class="filter-select__input"
    [value]="value()"
    (change)="onChange($event)"
  >
    <option value="all">{{ placeholder() }}</option>
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
</div>
