<div class="otp-container">
  @for (digit of digits; track $index; let i = $index) {
    <input
      #otpInput
      type="text"
      inputmode="numeric"
      maxlength="1"
      class="otp-input"
      [value]="digit"
      (input)="onInput($event, i)"
      (keydown)="onKeyDown($event, i)"
      (paste)="onPaste($event)"
      
      [attr.aria-label]="'OTP digit ' + (i + 1)" 
    />
  }
</div>
