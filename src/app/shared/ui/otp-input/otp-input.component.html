<div class="otp-container">
  @for (digit of otpDigits(); track $index; let i = $index) {
    <input
      type="text"
      inputmode="numeric"
      maxlength="1"
      class="otp-input"
      [value]="digit"
      (input)="onInput($event, i)"
      (keydown)="onKeyDown($event, i)"
      (paste)="onPaste($event)"
    />
  }
</div>
