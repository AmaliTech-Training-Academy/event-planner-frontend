<div class="form-group" [class.has-error]="hasError()" [class.focused]="isFocused()">
  @if (label()) {
    <label [attr.for]="label()">{{ label() }}</label>
  }

  <div class="input-wrapper">
    @if (iconSrc()) {
      <img [src]="iconSrc()" alt="icon" class="input-icon" />
    }

    <input
      [type]="inputType()"
      [placeholder]="placeholder()"
      [value]="value()"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      [disabled]="isDisabled()"
      [class.error]="hasError()"
    />

    @if (type() === 'password') {
      <button type="button" (click)="togglePasswordVisibility()" class="toggle-btn">
        <img
          [src]="showPassword() ? 'icons/eye-closed.svg' : 'icons/eye-open.svg'"
          alt="Toggle Password"
        />
      </button>
    }
  </div>
    <app-form-error
      *ngIf="hasError()"
      [message]="errorMessage()"
      [showIcon]="true"
      id="{{ label() + '-error' }}"
    ></app-form-error>
</div>
