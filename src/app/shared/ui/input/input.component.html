<div
  class="input-field-group"
  [class.has-error]="hasError()"
  [class.focused]="isFocused()"
  [class.disabled]="isDisabled()"
>
  @if (label()) {
  <label class="input-label" [attr.for]="formControlName()">
    {{ label() }}
    @if (required()) {
    <span class="required">*</span>
    }
  </label>
  }

  <div
    class="input-wrapper"
    [class.with-icon]="!!iconSrc()"
    [class.no-icon]="!iconSrc()"
  >
    @if (iconSrc()) {
    <img [src]="iconSrc()" alt="icon" class="input-icon" />
    }

    <input
      [type]="inputType()"
      [placeholder]="placeholder()"
      [value]="currentValue()"
      (input)="onValueChange($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      [disabled]="isDisabled()"
      [class.error]="hasError()"
      class="form-input"
    />

    @if (type() === 'password') {
    <button
      type="button"
      class="toggle-password"
      (click)="togglePasswordVisibility()"
      [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
    >
      <img
        [src]="
          showPassword() ? 'icons/eye-close-icon.png' : 'icons/eye-open.svg'
        "
        alt=""
      />
    </button>
    }
  </div>

  @if (hasError() && errorMessage()) {
  <app-form-error
    [message]="errorMessage()"
    [showIcon]="true"
    [attr.id]="formControlName() + '-error'"
  ></app-form-error>
  }
</div>
