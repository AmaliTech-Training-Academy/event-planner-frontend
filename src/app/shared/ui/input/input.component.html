<div
  class="form-group"
  [class.has-error]="hasError()"
  [class.focused]="isFocused()"
>
  @if (label()) {
    <label [attr.for]="formControlName()">
      {{ label() }}
      @if (required()) {
        <span>*</span>
      }
    </label>
  }

  <div class="input-wrapper">
    @if (iconSrc()) {
      <img [src]="iconSrc()" alt="icon" class="input-icon" />
    }

    <input
      [id]="formControlName()"
      [type]="inputType()"
      [placeholder]="placeholder()"
      [(ngModel)]="value()"
      (focus)="onFocus()"
      (blur)="onBlur()"
      [disabled]="disabled()"
      [class.error]="hasError()"
    />

    @if (type() === 'password') {
      <button
        type="button"
        class="toggle-btn"
        (click)="togglePasswordVisibility()"
        aria-label="Toggle password visibility"
      >
        <img
          [src]="
            showPassword()
              ? '/assets/icons/eye-close-icon.png'
              : '/assets/icons/eye.png'
          "
          alt="Toggle Password"
        />
      </button>
    }
  </div>
</div>
