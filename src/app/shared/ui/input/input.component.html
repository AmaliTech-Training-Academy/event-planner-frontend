<div class="form-group" [class.has-error]="hasError" [class.focused]="_isFocused()">
  <label *ngIf="label" [attr.for]="formControlName">
    {{ label }}
    <span *ngIf="required">*</span>
  </label>

  <div class="input-wrapper">
    <img *ngIf="iconSrc" [src]="iconSrc" alt="icon" class="input-icon" />
    <input
      [id]="formControlName"
      [type]="inputType"
      [placeholder]="placeholder"
      [(ngModel)]="_value"
      (focus)="onFocus()"
      (blur)="onBlur()"
      [disabled]="disabled"
      [class.error]="hasError"
    />
    <button
      *ngIf="type === 'password'"
      type="button"
      class="toggle-btn"
      (click)="togglePasswordVisibility()"
      aria-label="Toggle password visibility"
    >
      <img
        [src]="_showPassword() ? 'assets/icons/eye-off.png' : 'assets/icons/eye.png'"
        alt="Toggle Password"
      />
    </button>
  </div>

  <div class="error-message" *ngIf="hasError" role="alert">
    {{ errorMessage }}
  </div>
</div>
